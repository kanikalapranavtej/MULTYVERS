<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MULTYVERS{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/multyvers.css') }}">

    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    {% block nav %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}

    <div id="toast"
         class="toast"
         role="status"
         aria-live="polite">
    </div>

    <script src="{{ url_for('static', filename='js/multyvers.js') }}"></script>

    {% block scripts %}{% endblock %}

</body>
</html>
